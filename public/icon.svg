<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#001f54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle star particles -->
  <circle cx="120" cy="110" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="410" cy="90" r="3" fill="#fef08a" opacity="0.7" />
  <circle cx="90" cy="380" r="3.5" fill="#fef08a" opacity="0.6" />
  <circle cx="430" cy="390" r="4.5" fill="#38bdf8" opacity="0.8" />
  
  <!-- Star shape in corner -->
  <polygon points="380,140 386,155 402,157 390,168 393,184 380,175 367,184 370,168 358,157 374,155" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Big Badge Ring -->
  <circle cx="256" cy="245" r="170" fill="none" stroke="url(#blueGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="16 12" />

  <!-- Number 10 Main Typography -->
  <!-- "1" -->
  <path d="M 175 160 L 210 160 L 210 330 L 175 330 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 140 195 L 175 160 L 210 160" fill="url(#goldGrad)" />
  
  <!-- "0" -->
  <path d="M 315 160 C 270 160 250 200 250 245 C 250 290 270 330 315 330 C 360 330 380 290 380 245 C 380 200 360 160 315 160 Z M 315 200 C 330 200 342 220 342 245 C 342 270 330 290 315 290 C 300 290 288 270 288 245 C 288 220 300 200 315 200 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Rocket accent overlay -->
  <g transform="translate(230, 310) scale(0.9)">
    <path d="M 30 -25 Q 50 15 20 45 Q 10 35 5 25 Q 10 -5 30 -25 Z" fill="#38bdf8" />
    <path d="M 12 40 L 5 55 L 20 48 Z" fill="#ef4444" />
    <circle cx="24" cy="5" r="4" fill="#ffffff" />
  </g>

  <!-- Banner label: BERNARDO -->
  <rect x="116" y="380" width="280" height="48" rx="24" fill="#034078" stroke="#38bdf8" stroke-width="2" />
  <text x="256" y="411" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">BERNARDO</text>
</svg>
